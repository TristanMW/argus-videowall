<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argus Video Wall</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0B0E14" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar" id="app-bar">
    <div class="app-bar__brand"><span class="brand-dot"></span>Argus Video Wall</div>

    <div class="seg" id="presets" role="group" aria-label="Layout presets">
      <button class="seg__btn" data-preset="1" title="Single">1</button>
      <button class="seg__btn" data-preset="4" title="2 × 2">2×2</button>
      <button class="seg__btn" data-preset="6" title="2 × 3">2×3</button>
      <button class="seg__btn" data-preset="9" title="3 × 3">3×3</button>
      <button class="seg__btn" data-preset="16" title="4 × 4">4×4</button>
    </div>

    <button id="edit-toggle" class="btn" aria-pressed="false" title="Resize / arrange tiles">Edit layout</button>

    <div class="app-bar__spacer"></div>

    <button id="sidebar-toggle" class="btn btn--icon" title="Cameras panel" aria-pressed="true">☰</button>
    <button id="sound-toggle" class="btn btn--icon" title="Sound" aria-pressed="false">🔈</button>
    <button id="fs-toggle" class="btn btn--icon" title="Fullscreen">⛶</button>
    <a class="btn btn--icon" href="config.html" title="Cameras &amp; settings">⚙</a>
    <span id="clock" class="app-bar__clock"></span>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <span>Cameras</span>
        <span class="pill pill--count" id="cam-count">0</span>
        <button class="btn btn--icon sidebar__collapse" id="sidebar-collapse" title="Minimise camera list ([)">«</button>
      </div>
      <input class="in sidebar__search" id="cam-search" type="text" placeholder="Search cameras…" />
      <div class="cam-list" id="cam-list"></div>
      <div class="sidebar__hint" id="sidebar-hint"></div>
    </aside>

    <main class="wall" id="wall" data-mode="view"></main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- Account gate: shown until this box is linked to an Argus account. -->
  <div class="signin-gate" id="signin-gate" hidden>
    <div class="signin-card">
      <div class="signin-brand"><span class="brand-dot"></span>Argus Video Wall</div>
      <h2>Sign in to get started</h2>
      <p>This box links to an Argus account — <b>4 cameras are free, forever</b>.
         You sign in once; after that every screen on your network can view the wall.</p>
      <input class="in" id="gate-email" type="email" autocomplete="email" placeholder="you@example.com" />
      <input class="in" id="gate-pass" type="password" autocomplete="current-password" placeholder="password (6+ characters)" />
      <div class="signin-btns">
        <button class="btn primary" id="gate-signin">Sign in</button>
        <button class="btn" id="gate-signup">Create free account</button>
      </div>
      <div class="signin-note" id="gate-note"></div>
      <p class="signin-alt">Signed up with Google? Set a password via “Forgot password” on the
        <a href="https://argus-videowall.web.app/account.html" target="_blank" rel="noopener">account page</a>.</p>
    </div>
  </div>

  <script src="settings.js"></script>
  <script src="wall.js"></script>
  <script src="app.js"></script>
</body>
</html>
